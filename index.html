<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Age Calculator — enter a date of birth and get your age in years, months and days. A pixel-perfect Frontend Mentor solution built with Mithril.js and Vite."
    />
    <meta name="theme-color" content="#854dff" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%images/favicon-32x32.png" />
    <title>Frontend Mentor | Age calculator app</title>
    <link rel="preload" href="%BASE_URL%fonts/Poppins-Bold.ttf" as="font" type="font/ttf" crossorigin />

        font-family: 'Poppins';

        font-weight: 400;

        src: url('%BASE_URL%fonts/Poppins-Italic.ttf') format('truetype');

        font-family: 'Poppins';
